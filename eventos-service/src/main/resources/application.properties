spring.application.name=eventos-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/eventos_db
spring.datasource.username=eventos_user
spring.datasource.password=eventos_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

resilience4j.circuitbreaker.instances.notificacoesService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.notificacoesService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notificacoesService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.notificacoesService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificacoesService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.notificacoesService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.notificacoesService.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.timelimiter.instances.notificacoesService.timeoutDuration=4s
resilience4j.timelimiter.instances.notificacoesService.cancelRunningFuture=true