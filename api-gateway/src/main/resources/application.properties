spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

spring.cloud.gateway.server.webflux.routes[0].id=eventos-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://eventos-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/eventos/**

spring.cloud.gateway.server.webflux.routes[1].id=notificacoes-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://notificacoes-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notificacoes/**

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only